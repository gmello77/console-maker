# Copia questo file in roms.yaml e, per ogni console/emulatore, indica i file da scaricare.
#
# - La chiave (nes, snes, mame...) e' il nome della cartella Batocera in /userdata/roms.
# - `urls`: link diretti ai file su archive.org
#     https://archive.org/download/<identificativo>/<nome file>.zip
#   I sistemi senza `urls` né `item` non compaiono nel menu.
# - `item`: al posto dei singoli link, l'identificativo di un item archive.org
#     (la parte dopo archive.org/details/). Lo script legge l'elenco dei file da solo.
#     Opzioni, tutte facoltative: `include` / `exclude` (regex sul nome file, senza
#     maiuscole) e `files` (elenco esatto dei nomi da scaricare). Nella schermata il
#     pulsante "Scegli i giochi" salva la scelta in selections.yaml e batte `files`.
#     Con un item senza filtri si scarica TUTTO: controlla il totale nella schermata.
# - `priority`: numero intero (default 0). Se le ROM scelte non ci stanno nel disco, i
#     sistemi con priority piu' alta si riempiono per primi; a parita', l'ordine di questo
#     file. Dentro un sistema si tengono i giochi in ordine alfabetico finche' c'e' posto
#     (un gioco con piu' file, cue+bin o dischi multipli, entra tutto o niente).
# - `extract: true`: lo zip contiene molte ROM (un set completo) e va scompattato nella
#   cartella del sistema. Con `false` (default) il file resta cosi' com'e': va bene per
#   gli zip di singole ROM e per MAME/FBNeo, che vogliono gli zip chiusi.
#
# - Sezione `bios:` (in fondo): i file BIOS che alcuni emulatori richiedono (PlayStation,
#   Saturn, Neo Geo...). Stessa forma dei sistemi (`urls` oppure `item`, `extract`...), piu':
#     dir:  sottocartella di userdata/bios (vuota = direttamente in bios/)
#     for:  elenco dei sistemi per cui servono; il gruppo entra nell'immagine solo se
#           almeno uno e' presente (se l'adattamento al disco li toglie tutti, non si
#           scarica). Senza `for`, il gruppo entra sempre.
#   I BIOS vengono contati nello spazio e non vengono mai sfoltiti.
#
# Rispetta il copyright: scarica solo quello che hai il diritto di usare.

systems:
  nes:
    name: Nintendo NES
    urls: []
  snes:
    name: Super Nintendo
    urls: []
  gb:
    name: Game Boy
    urls: []
  gbc:
    name: Game Boy Color
    urls: []
  gba:
    name: Game Boy Advance
    urls: []
  megadrive:
    name: Sega Mega Drive / Genesis
    urls: []
  mastersystem:
    name: Sega Master System
    urls: []
  pcengine:
    name: PC Engine
    urls: []
  psx:
    name: PlayStation
    urls: []
  neogeo:
    name: Neo Geo
    urls: []
  mame:
    name: Arcade (MAME)
    urls: []
  fbneo:
    name: Arcade (FinalBurn Neo)
    urls: []
  # Esempio con un item intero filtrato (poi si sfoltisce dalla schermata):
  # psx:
  #   name: PlayStation
  #   item: <identificativo>
  #   include: '\.chd$'
  #   exclude: '\((Demo|Beta|Proto)'
  #
  # Esempio con un set da scompattare:
  # atari2600:
  #   name: Atari 2600
  #   extract: true
  #   urls:
  #     - https://archive.org/download/<identificativo>/<set completo>.zip

# Esempio di BIOS (decommenta e metti i tuoi link):
# bios:
#   psx:
#     name: BIOS PlayStation
#     for: [psx]
#     urls:
#       - https://archive.org/download/<identificativo>/scph1001.bin
#   dreamcast:
#     name: BIOS Dreamcast
#     dir: dc
#     for: [dreamcast]
#     urls:
#       - https://archive.org/download/<identificativo>/dc_boot.bin
